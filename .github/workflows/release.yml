# Changing the VERSION file on main publishes a release: the tests run,
# MonitorSwap.exe is built from this source, and MonitorSwap.zip is attached
# to a new GitHub release tagged v<VERSION>.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists != 'true'
        with:
          go-version: stable
      - name: Test, build and package
        if: steps.v.outputs.exists != 'true'
        run: ./package.sh
      - name: Publish release
        if: steps.v.outputs.exists != 'true'
        run: |
          tag="${{ steps.v.outputs.tag }}"
          gh release create "$tag" dist/MonitorSwap.zip \
            --target "$GITHUB_SHA" \
            --title "MonitorSwap ${tag#v}" \
            --notes-file packaging/RELEASE_NOTES.md
