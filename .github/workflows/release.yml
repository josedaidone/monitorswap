# Pushing a tag like v0.1.0 runs the tests, builds MonitorSwap.exe from this
# source and attaches MonitorSwap.zip to a GitHub release of the same name.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test, build and package
        run: ./package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MonitorSwap.zip \
            --title "MonitorSwap ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/RELEASE_NOTES.md
